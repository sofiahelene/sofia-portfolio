<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tote mockup</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js",
    "three/addons/loaders/GLTFLoader.js": "https://unpkg.com/three@0.184.0/examples/jsm/loaders/GLTFLoader.js",
    "three/addons/utils/BufferGeometryUtils.js": "https://unpkg.com/three@0.184.0/examples/jsm/utils/BufferGeometryUtils.js",
    "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.9.1/build/index.module.js"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #f4f2ee; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; left: 20px; top: 20px; z-index: 10;
        display: flex; flex-direction: column; gap: 6px;
        font: 11px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: 0.08em; text-transform: uppercase; color: #2c2a27; }
  #ui .label { color: #9a958c; font-size: 10px; }
  #ui .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; letter-spacing: inherit; text-transform: inherit;
           padding: 7px 11px; border: 1px solid #d9d5cb; border-radius: 2px;
           background: #fbfaf7; color: #2c2a27; cursor: pointer; }
  button:hover { border-color: #b3ada0; }
  button[aria-pressed="true"] { background: #2c2a27; border-color: #2c2a27; color: #fbfaf7; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
             background: #f4f2ee; color: #9a958c;
             font: 11px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.12em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="loading">loading tote…</div>
<div id="ui" hidden>
  <div class="label">view</div>
  <div class="row" id="views"></div>
</div>
<three-d-stage name="tour-tote" background="#f4f2ee"></three-d-stage>
<script src="./three-d-stage.js"></script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let BVH = null;
try {
  BVH = await import('three-mesh-bvh');
  THREE.BufferGeometry.prototype.computeBoundsTree = BVH.computeBoundsTree;
  THREE.Mesh.prototype.raycast = BVH.acceleratedRaycast;
} catch (e) { console.warn('BVH unavailable, using a coarser decal grid', e); }

const stage = document.querySelector('three-d-stage');
await stage.ready;

const gltf = await new GLTFLoader().loadAsync('./tote/scene.gltf');
const tote = new THREE.Group();
tote.name = 'tour_tote';
tote.add(gltf.scene);
gltf.scene.traverse(o => { if (o.isCamera || o.isLight) o.visible = false; });

// black canvas: the baked photo texture, flattened to luminance so the weave,
// seams and strap shading survive while the colour comes from the material
const canvasTex = await new THREE.TextureLoader().loadAsync('./tote/textures/black-canvas.png');
canvasTex.colorSpace = THREE.SRGBColorSpace;
canvasTex.anisotropy = 8;
canvasTex.flipY = false;
canvasTex.name = 'tote_canvas';

const cloth = [];
gltf.scene.traverse(o => {
  if (!o.isMesh) return;
  o.castShadow = o.receiveShadow = true;
  o.material = new THREE.MeshStandardMaterial({
    name: 'tote_canvas', color: 0x1a1a1d, map: canvasTex,
    roughness: 0.93, metalness: 0, side: THREE.DoubleSide,
  });
  if (BVH) o.geometry.computeBoundsTree();
  cloth.push(o);
});

// the model's broad panels face ±X; turn them to face ±Z so the front of the
// bag faces the camera
gltf.scene.rotation.y = Math.PI / 2;
// normalise: ~0.42 m tall including the straps, standing on the ground
gltf.scene.updateMatrixWorld(true);
let box = new THREE.Box3().setFromObject(gltf.scene);
const size = box.getSize(new THREE.Vector3());
gltf.scene.scale.multiplyScalar(0.42 / size.y);
gltf.scene.updateMatrixWorld(true);
box = new THREE.Box3().setFromObject(gltf.scene);
const ctr = box.getCenter(new THREE.Vector3());
gltf.scene.position.sub(new THREE.Vector3(ctr.x, box.min.y, ctr.z));
tote.updateMatrixWorld(true);

const bounds = new THREE.Box3().setFromObject(tote);
const span = bounds.getSize(new THREE.Vector3());
const ray = new THREE.Raycaster();

// the front panel is the side whose surface sits closest to the camera plane
// across the middle of the bag — measured, not assumed
const depthAt = (sign) => {
  let sum = 0, n = 0;
  for (let i = -2; i <= 2; i++) {
    const x = (i / 8) * span.x;
    const y = bounds.min.y + span.y * 0.42;
    ray.set(new THREE.Vector3(x, y, sign * span.z), new THREE.Vector3(0, 0, -sign));
    const hit = ray.intersectObjects(cloth, true)[0];
    if (hit) { sum += Math.abs(hit.point.z); n++; }
  }
  return n ? sum / n : 0;
};
const FRONT_Z = depthAt(1) >= depthAt(-1) ? 1 : -1;

const tex = await new THREE.TextureLoader().loadAsync('./logo-sun-v4.png');
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = 8;
tex.name = 'logo';

// screen-print decal: a grid projected straight onto the panel along its axis,
// so the artwork follows the canvas instead of floating over it
function printDecal({ aspect, widthFrac, centreY, axis, name }) {
  const W = span.x * widthFrac, H = W / aspect;
  const N = BVH ? 40 : 16;
  const uv = [], idx = [], pos = new Float32Array((N + 1) * (N + 1) * 3);
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) uv.push(i / N, 1 - j / N);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const a = i * (N + 1) + j, b = a + (N + 1);
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);

  const dir = new THREE.Vector3(0, 0, -axis);
  const start = span.z * 1.4;
  const eps = span.z * 0.008;
  const p = new THREE.Vector3(), n = new THREE.Vector3();
  const yTop = bounds.min.y + span.y * centreY + H / 2;
  const mid = N >> 1;
  for (let j = 0; j <= N; j++) {
    for (const step of [-1, 1]) {
      let good = -1;
      for (let s = 0; s <= mid + 1; s++) {
        const i = step < 0 ? mid - s : mid + s;
        if (i < 0 || i > N) break;
        const k = (i * (N + 1) + j) * 3;
        const x = (i / N - 0.5) * W * axis;
        p.set(x, yTop - (j / N) * H, axis * start);
        ray.set(p, dir);
        const hit = ray.intersectObjects(cloth, true)[0];
        let ok = false;
        if (hit) {
          n.copy(hit.face.normal).transformDirection(hit.object.matrixWorld);
          if (n.z * axis > 0.12) { p.copy(hit.point).addScaledVector(n, eps); ok = true; }
        }
        if (ok) {
          tote.worldToLocal(p);
          pos[k] = p.x; pos[k + 1] = p.y; pos[k + 2] = p.z;
          good = k;
        } else if (good >= 0) {
          pos[k] = pos[good]; pos[k + 1] = pos[good + 1]; pos[k + 2] = pos[good + 2];
        } else {
          pos[k] = x; pos[k + 1] = yTop - (j / N) * H; pos[k + 2] = axis * span.z * 0.5;
        }
      }
    }
  }
  geo.computeVertexNormals();
  geo.computeBoundingSphere();

  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    name, map: tex, transparent: true, alphaTest: 0.5,
    roughness: 0.82, metalness: 0, side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4,
  }));
  mesh.name = name;
  mesh.castShadow = false;
  tote.add(mesh);
  return mesh;
}

printDecal({ aspect: 955 / 926, widthFrac: 0.46, centreY: 0.30,
             axis: FRONT_Z, name: 'front_print' });

stage.setObject(tote);

const camera = stage._camera, controls = stage._controls;
camera.near = 0.01; camera.far = 30; camera.updateProjectionMatrix();
stage._ground.material.opacity = 0.14;
stage._key.position.set(0.9, 2.2, 1.4);

const f = FRONT_Z;
const VIEWS = {
  front: [0, 0.24, 0.72 * f],
  'three-quarter': [0.46 * f, 0.28, 0.56 * f],
  side: [0.70, 0.24, 0.04 * f],
  back: [0, 0.26, -0.70 * f],
};
const target = new THREE.Vector3(0, span.y * 0.5, 0);
const to = new THREE.Vector3(...VIEWS['three-quarter']);
let driving = false;

const row = document.getElementById('views');
for (const name of Object.keys(VIEWS)) {
  const b = document.createElement('button');
  b.textContent = name; b.dataset.view = name;
  b.addEventListener('click', () => {
    driving = false;
    to.set(...VIEWS[name]);
    row.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
  row.append(b);
}
row.querySelector('[data-view="three-quarter"]').setAttribute('aria-pressed', 'true');
camera.position.copy(to);
controls.target.copy(target);
controls.update();
controls.addEventListener('start', () => {
  driving = true;
  row.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
});
(function tick() {
  if (!driving) {
    camera.position.lerp(to, 0.06);
    controls.target.lerp(target, 0.08);
    controls.update();
  }
  requestAnimationFrame(tick);
})();

document.getElementById('loading').remove();
document.getElementById('ui').hidden = false;
</script>
</body>
</html>
